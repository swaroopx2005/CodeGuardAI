# Server Port (Auto-binds to cloud environment PORT or defaults to 8080)
server.port=${PORT:8080}

# CodeGuard AI Database Configuration
# Embedded database with PostgreSQL compatibility mode (Instant start in 0.1s with zero setup!)
spring.datasource.url=jdbc:h2:mem:codeguard;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Enable H2 Web Console at http://localhost:8080/h2-console
spring.h2.console.enabled=true
